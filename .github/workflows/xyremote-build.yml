name: XYRemote Build

on:
  push:
    branches: [brand/xyremote]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup vcpkg and install deps
        shell: bash
        run: |
          if [ -d "/c/vcpkg" ]; then
            cd /c/vcpkg && git pull
          else
            git clone https://github.com/microsoft/vcpkg.git /c/vcpkg
          fi
          cd /c/vcpkg && ./bootstrap-vcpkg.sh
          ./vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
          echo "VCPKG_ROOT=/c/vcpkg" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"

      - name: Install bridge codegen
        run: cargo install flutter_rust_bridge_codegen --version 1.80.1 --locked

      - name: Generate bridge
        shell: bash
        run: |
          cd flutter
          flutter pub get
          flutter_rust_bridge_codegen --rust-input ../src/flutter_ffi.rs --dart-output lib/generated_bridge.dart --c-output windows/bridge_generated.h

      - name: Build Rust
        shell: bash
        run: VCPKG_ROOT=/c/vcpkg cargo build --release --features flutter

      - name: Build Flutter Windows
        working-directory: flutter
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XYRemote-Windows-x64
          path: flutter/build/windows/x64/runner/Release/

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ gcc git curl wget nasm yasm libgtk-3-dev clang libxcb-randr0-dev libxdo-dev libxfixes-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev libpulse-dev cmake make libclang-dev ninja-build libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpam0g-dev libappindicator3-dev libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup vcpkg and install deps
        run: |
          git clone https://github.com/microsoft/vcpkg.git $HOME/vcpkg
          $HOME/vcpkg/bootstrap-vcpkg.sh
          $HOME/vcpkg/vcpkg install libvpx libyuv opus aom
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"

      - name: Install bridge codegen
        run: cargo install flutter_rust_bridge_codegen --version 1.80.1 --locked

      - name: Generate bridge
        run: |
          cd flutter
          flutter pub get
          flutter_rust_bridge_codegen --rust-input ../src/flutter_ffi.rs --dart-output lib/generated_bridge.dart --c-output linux/bridge_generated.h

      - name: Build Rust
        run: cargo build --release --features flutter

      - name: Build Flutter Linux
        working-directory: flutter
        run: flutter build linux --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XYRemote-Linux-x64
          path: flutter/build/linux/x64/release/bundle/
